services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: centro_computo
      POSTGRES_USER: centro
      POSTGRES_PASSWORD: centro
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U centro -d centro_computo"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm start"
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
  node_modules:
